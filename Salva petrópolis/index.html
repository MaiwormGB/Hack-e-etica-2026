<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salva Petropolis</title>
    <link rel="stylesheet"href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="acervo/map-pin-alt-svgrepo-com.svg">
</head>
<body>
    
    <div class="main">

        <div class="header">


            <div class="titulo">

                <h1>Salva Petrópolis</h1>
                <h3>Da comunidade, pra comunidade</h3>

            </div>

            <input class="pesquisa" type="text" id="pesquisa" placeholder="Pesquisa">

            <button onclick="buscarLocal()" id="buscar" >Buscar</button>

            <div class="buttons">

                <button onclick="mostrarPesquisa()">Pesquisar</button>
                <button>Lista de <br> problemas / soluções</button>
                <button>Quem somos</button>

                <svg id="logo" width="120" height="100%">
                    <image 
                        href="acervo/map-pin-alt-svgrepo-com.svg"
                        height="100%">
                    </image>
                </svg>

            </div>

        </div>

        <div id="formulario">

            <div class="form_header">

                <div class="sair_btn" onclick="sairForm()"> <img src="acervo/x-1-svgrepo-com.svg" width="50px" height="50px" alt=""></div>

                <h1 id="form_titulo">[Titulo]</h1>

                <div class="mudar_btn" onclick="mudarForm()"> <img src="acervo/lamp-light-svgrepo-com.svg" id="icone_btn" width="50px" height="50px" alt=""></div>

                

            </div>

            <input type="text" id="form_input" placeholder="Problema">

            <select name="tipos" id="form_tipos">

                <option value="">Má coleta de lixo</option>
                <option value="">Risco de desabamento</option>
                <option value="">Risco de alagamento</option>
                <option value="">Infraestrutura publica danificada</option>
                <option value="">Criminalidade</option>
                <option value="">Outro</option>

            </select>

            <textarea name="detalhamento" id="detalhamento" placeholder="detalhamento"></textarea>

            <div class="estrelas">
                <span data-valor="1">★</span>
                <span data-valor="2">★</span>
                <span data-valor="3">★</span>
                <span data-valor="4">★</span>
                <span data-valor="5">★</span>
            </div>

            <button onclick="salvar()">Enviar</button>

        </div>

        <div id="map"></div>

    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="scripts/script.js"></script>

</body>
</html>
